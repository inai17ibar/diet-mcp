[project]
name = "diet-mcp"
version = "0.2.0"
description = "Diet / meal log MCP server, exposed over Streamable HTTP for remote connectors (e.g. ChatGPT)"
requires-python = ">=3.11"
dependencies = [
    # メジャー跨ぎでAPIが変わる（1.x→2.xでFastMCP→MCPServer）。Dockerfileは
    # ロックファイル無しで毎回解決するため、上限を固定しておく
    "mcp>=2.2,<3",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
diet-mcp = "diet_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# legacy/ は移行前の旧サーバーの置き場で、保守対象外なので収集しない
testpaths = ["tests"]
