[project]
name = "diet-mcp"
version = "0.2.0"
description = "Diet / meal log MCP server, exposed over Streamable HTTP for remote connectors (e.g. ChatGPT)"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.xでFastMCPがMCPServerに改名され、server.py/oauth_provider.pyが動かなくなる。
    # 2.x対応は別途行うまで上限を固定する（Dockerfileはロックファイル無しで毎回解決するため必須）
    "mcp>=1.21.2,<2",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
diet-mcp = "diet_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# legacy/ は移行前の旧サーバーの置き場で、保守対象外なので収集しない
testpaths = ["tests"]
