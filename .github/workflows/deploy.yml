name: deploy

# mainへのpushでFly.ioへ自動デプロイする。ローカルでflyctlを叩かなくて済むよう、
# ビルドもFly側（--remote-only）で行う。GitHub Secretsに FLY_API_TOKEN が必要。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-diet-mcp
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest -q

  deploy:
    # ChatGPTコネクタとdiet-publisherが依存しているので、テストが通った時だけ出す
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
